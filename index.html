<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X World - Telegram Videos</title>
  <style>
    /* পুরো পেজের ব্যাকগ্রাউন্ড কালার ও স্টাইল */
    body {
      background-color: #181a1b;
      color: #ffffff;

      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;

      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <h1>X World Video Feed</h1>

  <div class="telegram-feed-container">
    <!-- Telegram Official Channel Widget for xworld85889 -->
    <script async src="https://telegram.org/js/telegram-widget.js?22" 
            data-telegram-channel="xworld85889" 
            data-width="100%" 
            data-height="750px" 
            data-dark="1">

</body>
</html>
