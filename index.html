<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X World - Videos</title>
  <style>
    body {
      background-color: #181a1b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 15px 0;
      font-size: 22px;
    }
    /* ফিড কন্টেইনার স্টাইল */
    .telegram-feed-container {
      width: 100%;
      max-width: 550px;
      background: #1f2326;
      border: 1px solid #2f3438;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      min-height: 500px;
    }
  </style>
</head>
<body>

  <h1>X World Video Feed</h1>

  <div class="telegram-feed-container">
    <script async src="https://telegram.org/js/telegram-widget.js?22" 
            data-telegram-channel="xworld85889" 
            data-width="100%" 
            data-height="600px" 
            data-dark="1">
    </script>
  </div>

</body>
</html>
